[mod-setting-description]
cr-gun-turret-range=Base maximum attack range before quality bonuses. Default: 18. Very large ranges can consume substantial memory and CPU; the setting limit is not a safety guarantee.
cr-gun-turret-min-range=Base minimum targeting distance. Default: 0. Values above the maximum range are clamped to the maximum and logged.
cr-gun-turret-prepare-range=Negative values preserve the native automatic preparation range, which follows attack range. Nonnegative values set an explicit preparation radius. Default: -1.
cr-gun-turret-cooldown=Base ticks between shots. 60 ticks = 1 second; shots per second = 60 / interval before research. Default: 6 (10 shots/s). Values below 1 permit multiple shots per tick. Minimum: 0.001 to exclude zero and unbounded firing loops.
cr-gun-turret-warmup=Native attack warmup: ticks between a shooting order and the shot. Separate from raising the turret. Default: 0.
cr-gun-turret-cooldown-deviation=Native random cooldown deviation, from 0 to 1. Default: 0 (no random deviation).
cr-gun-turret-damage-modifier=Native turret damage coefficient applied to the loaded ammunition. Default: 1. Ammo damage and turret damage research still apply. This is a coefficient because damage depends on the ammunition.
cr-gun-turret-ammo-consumption-modifier=Native ammunition consumption coefficient. Default: 1 (one round, not one magazine). 0 permits firing without consuming loaded ammunition; ammunition must still be present. Fractional values use engine accounting.
cr-gun-turret-rotation-speed=Absolute turns per tick. Default: 0.015. 0 prevents rotation; 1 is one full turn per tick. A changed value applies to both native rotation variants.
cr-gun-turret-preparing-time=Native preparation duration = 1 / preparing_speed. Default: 12.5 ticks (speed 0.08). Minimum: 1 tick. Both speed variants change together. Actual transitions occur on whole game ticks.
cr-gun-turret-folding-time=Native folding duration = 1 / folding_speed. Default: 12.5 ticks (speed 0.08). Minimum: 1 tick. Both speed variants change together.
cr-gun-turret-inventory-size=Number of ammunition inventory slots, not rounds or magazine size. Default: 1. Capacity also depends on ammunition stack sizes. Reducing slots can discard stored ammunition; back up saves first.
cr-gun-turret-automated-ammo-count=Native number of ammunition items inserters try to supply. Default: 10 magazines. Limited by inventory capacity; does not change magazine size or item stack size.
cr-gun-turret-prepare-with-no-ammo=Allow the native turret preparation state without loaded ammunition. Default: enabled.
cr-gun-turret-shoot-in-prepare-state=Allow native firing in the preparation state. Default: disabled.
cr-gun-turret-start-attacking-only-when-can-shoot=Check ammunition availability before entering the starting-attack state. Default: disabled. This does not remove ammunition requirements for firing.
cr-gun-turret-leave-attacking-if-shoot-fails=Native behavior when a shot fails, such as running out of ammunition. Default: enabled.
cr-gun-turret-can-retarget-while-starting-attack=Allow native retargeting while starting an attack. Default: disabled. Effect depends on the native state transitions; no extra animation is added.
cr-gun-turret-allow-turning-when-starting-attack=Allow native rotation while starting an attack. Default: disabled.
cr-gun-turret-range-mode=Native range distance calculation. Default: center-to-center. Other modes account for source and/or target bounding boxes.
cr-gun-turret-health-penalty=Target scoring penalty for health ratio. Higher values prefer damaged targets; negative values prefer healthier targets. Default: 10.
cr-gun-turret-rotate-penalty=Higher values discourage targets requiring more rotation. Default: 0.
cr-gun-turret-fire-penalty=Positive values prefer targets without a fire-spreading sticker. Default: 0.
cr-gun-turret-threatening-asteroid-penalty=Positive values discourage threatening asteroids; negative values prefer them. Default: -20. Relevant when asteroids are present.
cr-gun-turret-call-for-help-radius=Native call-for-help radius. Default: 40. Does not extend another turret's firing range.
cr-gun-turret-max-health=Base maximum health before quality bonuses. Default: 400. Existing entities retain engine-managed health when saves are loaded; this does not explicitly heal them.
cr-gun-turret-healing-per-second=Absolute health regenerated per second, divided by 60 to obtain healing_per_tick. Default: 0. Negative values cause passive health loss. Slow regeneration is applied once per second by the engine.
cr-gun-turret-repair-speed-modifier=Native multiplier for repair tool speed on this turret. Default: 1.
cr-gun-turret-is-military-target=Make the turret a high-priority military target for enemies. Default: enabled.
cr-gun-turret-alert-when-attacking=Native attack alerts. Default: enabled.
cr-gun-turret-alert-when-damaged=Native damage alerts. Default: enabled.
cr-gun-turret-create-ghost-on-death=Native ghost creation on destruction, subject to the force's normal ghost rules. Default: enabled.
cr-gun-turret-circuit-wire-max-distance=Maximum circuit wire distance from this turret. Default: 9. The other endpoint's wire reach also limits connections.
cr-gun-turret-mining-time=Base mining time before character/tool modifiers. Default: 0.5 seconds.
cr-gun-turret-heating-energy=Negative values preserve official data: 0 kW in base, 50 kW with Space Age. 0 disables freezing; positive values set the heating requirement. This is not an electrical firing cost. Default: -1.
cr-gun-turret-resistance-physical-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-physical-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-impact-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-impact-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-poison-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-poison-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-explosion-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-explosion-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-fire-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-fire-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-laser-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-laser-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-acid-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-acid-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.
cr-gun-turret-resistance-electric-decrease=Flat damage reduction using the native resistance formula. Default: 0. Applies only to incoming damage of this type.
cr-gun-turret-resistance-electric-percent=Native percentage damage resistance, from 0 to 100. Default: 0. 100 grants immunity to this damage type.

