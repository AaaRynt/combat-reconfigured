[cr-setting-name]
rotation-speed=__1__: Cannon rotation speed (degrees/s)
blast-radius=__1__: Shell damage radius (tiles; shared)
range=__1__: Maximum range (tiles)
cooldown=__1__: Shot interval (ticks)
damage-modifier=__1__: Damage coefficient
ammo-consumption-modifier=__1__: Ammo consumption coefficient
fluid-consumption=__1__: Fluid per shot (units)
energy-per-shot=__1__: Energy per shot (J)
chain-jumps=__1__: Maximum chain jumps
manual-range=__1__: Manual maximum range (tiles)
line-length=__1__: Actual attack line length (tiles; shared)

[cr-setting-description]
rotation-speed=Shared absolute cannon rotation speed for BOTH artillery turret and wagon. Default: 21.6 degrees/second (0.001 turns/tick). 360 degrees/second is one full turn per second. Native turn-after-shot delay, parking and wagon movement stay unchanged. This is not the firing interval.
blast-radius=Actual artillery shell damage radius, not diameter. Default: 4 tiles. The shared shell applies both physical and explosion damage within this radius for artillery turrets and wagons. Visual explosion, smoke, map reveal and damage per target stay unchanged. Radius 32 covers 64 times the area of radius 4; more affected entities can increase CPU work and native collateral damage.
range=Base maximum targeting distance before native research/quality. Default: __1__ tiles. Native minimum range stays __2__ tiles. Values must exceed that blind spot. Increasing a turret range extends insufficient embedded beam/preparation limits only on that turret. Railgun shot length is a separate shared setting. Very large ranges can consume substantial memory/CPU; the input ceiling is a performance guard, not a safety guarantee.
cooldown=Base ticks between shots before native bonuses. 60 ticks = 1 second; base shots/s = 60 / interval. Default: __1__. Smaller means faster. The input minimum is 1 tick; native bonuses may still reduce the effective interval below 1 tick. Ammo, power, preparation and reloading can still limit actual firing.
damage-modifier=Native damage coefficient for this weapon, applied to its ammunition/actions. Default: __1__. This is not a fixed HP-per-shot value. Native research, quality and target resistances remain in effect. Shared ammunition, projectiles and beam damage are not rewritten. Zero does not disable firing or non-damage effects.
ammo-consumption-modifier=Native ammunition consumption coefficient per shot. Default: __1__. 1 normally means one round, not an entire magazine. 0 still requires compatible loaded ammunition. Single-round magazines cap native per-shot debit at their magazine size; those weapons are limited to coefficients 0-1. Applies only to this weapon. Native ammo-specific modifiers remain. Railgun turret electricity is a separate cost.
fluid-consumption=Native fluid units consumed per shot. Default: __1__. This is not units/second; combine with the shot interval. The 0-10 range stays within the vanilla 100-unit reservoir. Native input flow, capacity and fuel damage bonuses stay unchanged.
energy-per-shot=Absolute native energy cost per shot. Default: __1__ J. 1 MJ = 1000000 J. This is not standby power (W). If necessary, only this turret's buffer grows to fit the shot while retaining vanilla headroom. Input power and standby drain stay unchanged; a large cost can reduce sustained fire. Railgun turrets still need ammunition.
chain-jumps=Maximum jumps in this weapon's own Tesla chain. Default: __1__. The other Tesla weapon has a different chain and is unaffected. Native jump reach, branching probability and quality bonuses stay unchanged. More jumps can greatly increase work and total hits.
manual-range=Absolute base manual range for BOTH artillery turret and wagon. Default: 560 tiles. Automatic range is separate; this input stays fixed when automatic range changes. Native research/quality still apply. The native ratio is derived internally, so a manual input below the automatic input is allowed.
line-length=Actual line-action reach of shared railgun ammunition. Default: 50 tiles. Affects BOTH the handheld railgun and railgun turret using this ammo. Their targeting ranges are separate; increasing one does not silently alter the other. For longer actual shots, set both the relevant weapon range and this line length. Other ammo damage/actions stay unchanged.

[cr-note]
bounds=Allowed input: __1__ to __2__ (inclusive). These limits apply before native research/quality/ammo bonuses.
artillery-shared=Shared artillery setting: affects BOTH artillery turret and artillery wagon. No handheld or other vehicle weapon is affected.
spidertron-shared=Shared Spidertron setting: applies the same value to all FOUR native rocket launchers. Interval and ammo cost are per launcher/shot, not the combined rate or cost of all four. Other rocket weapons are unaffected.
