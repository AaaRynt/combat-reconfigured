[mod-setting-description]
cr-ammo-turret-gun-turret-attack-from-start-frame=Attack from start frame. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: False. Exact field: attack_from_start_frame.
cr-ammo-turret-gun-turret-overkill-fraction=Overkill fraction. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: 0.05. Exact field: overkill_fraction.
cr-ammo-turret-gun-turret-attack-parameters-lead-target-for-projectile-delay=Lead target for projectile delay. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: 0. Exact field: attack_parameters.lead_target_for_projectile_delay.
cr-ammo-turret-gun-turret-attack-parameters-lead-target-for-projectile-speed=Lead target for projectile speed. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: 0. Exact field: attack_parameters.lead_target_for_projectile_speed.
cr-ammo-turret-gun-turret-attack-parameters-true-collinear-ejection=True collinear ejection. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: False. Exact field: attack_parameters.true_collinear_ejection.
cr-ammo-turret-gun-turret-attack-parameters-turn-range=Fraction of a full circle. Engine clamps values between 0.5 and 1 to 0.5, except exactly 1. Scope: ammo-turret/gun-turret. Default: 1. Exact field: attack_parameters.turn_range.
cr-ammo-turret-gun-turret-attack-parameters-use-shooter-direction=Use shooter direction. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: False. Exact field: attack_parameters.use_shooter_direction.
cr-ammo-turret-gun-turret-attack-parameters-apply-projection-to-projectile-creation-position=Apply projection to projectile creation position. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: True. Exact field: attack_parameters.apply_projection_to_projectile_creation_position.
cr-ammo-turret-gun-turret-attack-parameters-projectile-creation-distance=Projectile creation distance. Uses the native engine property; only this listed path is changed. Scope: ammo-turret/gun-turret. Default: 1.39375. Exact field: attack_parameters.projectile_creation_distance.
