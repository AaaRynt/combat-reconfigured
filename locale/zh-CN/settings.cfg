[mod-name]
combat-reconfigured=Combat Reconfigured

[mod-description]
combat-reconfigured=自定义原版与太空时代枪械、炮塔的核心射程、射击间隔、伤害及资源消耗。

[cr-weapon]
gun-turret=机枪炮塔
laser-turret=激光炮塔
flamethrower-turret=火焰喷射炮塔
rocket-turret=火箭炮塔
tesla-turret=特斯拉炮塔
railgun-turret=电磁轨道炮塔
pistol=手枪
submachine-gun=冲锋枪
shotgun=霰弹枪
combat-shotgun=战斗霰弹枪
rocket-launcher=火箭发射器
flamethrower=手持火焰喷射器
railgun=手持电磁轨道炮
teslagun=手持特斯拉枪
vehicle-machine-gun=汽车机枪
tank-machine-gun=坦克机枪
tank-cannon=坦克主炮
tank-flamethrower=坦克火焰喷射器
artillery=火炮炮塔与车厢 [共享设置]
railgun-ammo=电磁轨道炮弹药 [共享]
spidertron-rocket-launcher=蜘蛛机甲火箭发射器 1～4（共享）

[cr-setting-name]
rotation-speed=__1__: 炮管转速（度/秒）
blast-radius=__1__: 炮弹伤害半径（格；共享）
range=__1__: 最大射程（格）
cooldown=__1__: 射击间隔（tick）
damage-modifier=__1__: 伤害系数
ammo-consumption-modifier=__1__: 弹药消耗系数
fluid-consumption=__1__: 每次射击流体消耗（单位）
energy-per-shot=__1__: 每次射击能量（J）
chain-jumps=__1__: 最大连锁跳数
manual-range=__1__: 手动最大射程（格）
line-length=__1__: 实际攻击线长（格；共享）

[cr-setting-description]
rotation-speed=统一设置火炮炮塔和火炮车厢的炮管绝对转速，默认 21.6 度/秒（原生 0.001 圈/tick）。360 度/秒为每秒转一整圈。保留原生开炮后转向等待、停放动作及车厢移动机制。这不是射击间隔。
blast-radius=实际火炮炮弹伤害半径，不是直径，默认 4 格。炮塔和车厢共用该炮弹，在此范围施加原生物理及爆炸伤害。视觉爆炸、烟雾、地图揭示及每个目标受到的伤害量保持不变。半径 32 的面积是半径 4 的 64 倍，影响更多实体可能增加计算量和原生附带伤害。
range=原生科技与品质加成前的基础最大索敌距离。默认 __1__ 格。原生最小射程保留为 __2__ 格，输入必须超过该盲区。增加炮塔射程时，仅在该炮塔内部提高不足的光束传递/准备范围。轨道炮实际线长需另设共享项。超大射程可能大量消耗内存和 CPU，输入上限只是性能保护，不是安全保证。
cooldown=原生加成前的基础射击间隔。60 tick 为 1 秒，基础每秒射数为 60 / 间隔。默认 __1__。数值越小越快，输入最小 1 tick；原生加成仍可能让最终间隔小于 1 tick。实际射速仍可能受弹药、电力、准备及换弹限制。
damage-modifier=作用于本武器弹药/动作的原生伤害系数。默认 __1__。这不是固定的每发 HP 伤害。保留原生科技、品质及目标抗性机制，不改写共享弹药、投射物或光束的基础伤害。0 不会关闭开火或非伤害效果。
ammo-consumption-modifier=原生每次射击弹药消耗系数。默认 __1__。1 通常表示一发，而非整个弹匣。0 仍需装入兼容弹药。原生单发弹药的单次扣除受弹匣容量限制，因此对应武器只开放 0–1 系数。仅作用于本武器，保留弹药自带的原生消耗修饰。电磁轨道炮塔的用电另设一项。
fluid-consumption=每次射击消耗的原生流体单位数。默认 __1__。这不是每秒流量，需结合射击间隔理解。0–10 的范围不超过原版 100 单位缓冲；保留原生输入流量、容量和不同燃料的伤害加成。
energy-per-shot=每次射击的绝对原生能耗，默认 __1__ J。1 MJ = 1000000 J。这不是待机功率 W。必要时仅扩大此炮塔的能量缓冲，并保留原版余量；输入功率与待机消耗不变，较大单发能耗可能降低持续射速。电磁轨道炮塔仍需弹药。
chain-jumps=本武器专用特斯拉连锁的最大跳数，默认 __1__。另一种特斯拉武器使用不同连锁，不受影响。保留原生每跳距离、分支概率和品质加成。较多跳数可能明显增加计算量与总命中数。
manual-range=同时设置火炮炮塔和车厢的绝对基础手动射程，默认 560 格。自动射程另设，修改自动射程时此基础手动输入保持固定。保留原生科技/品质加成。内部换算为原生比例，因此允许手动输入小于自动输入。
line-length=共享轨道炮弹药的实际线性动作距离，默认 50 格。影响使用该弹药的手持电磁轨道炮和炮塔。二者索敌射程独立，修改其一不会暗中修改另一个。要实现更远的实际攻击，需同时设置对应武器射程与此线长。其他弹药伤害/动作保持不变。

[cr-note]
bounds=允许输入：__1__ 至 __2__（包含边界）。限制作用于原生科技、品质及弹药加成之前的基础输入。
artillery-shared=共享火炮设置：此设置同时影响火炮炮塔与火炮车厢，不影响手持武器或其他车载武器。
spidertron-shared=共享蜘蛛机甲设置：同一个数值统一作用于四个原生火箭发射器。间隔及耗弹按单个发射器、单次射击计算，不是四个合计的射速或消耗。不影响其他火箭武器。
