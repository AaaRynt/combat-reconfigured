[mod-setting-description]
cr-gun-turret-range=品质加成前的基础最大射程。默认 18。超大射程可能大量消耗内存和 CPU；设置上限不代表性能安全保证。
cr-gun-turret-min-range=基础最小索敌距离。默认 0。超过最大射程时会被限制为最大射程，并记录日志。
cr-gun-turret-prepare-range=负值保留原生自动准备范围，随攻击射程变化；非负值指定准备索敌半径。默认 -1。
cr-gun-turret-cooldown=基础射击间隔，60 tick 为 1 秒。研究加成前每秒射数为 60 / 间隔。默认 6（每秒 10 发）。小于 1 时可在一个 tick 内多次射击。最小 0.001，避免零间隔和无界开火循环。
cr-gun-turret-warmup=原生攻击预热：接到射击指令后到开火的延迟，与炮塔展开时间分开。默认 0。
cr-gun-turret-cooldown-deviation=原生射击间隔随机偏差，范围 0 到 1。默认 0（无随机偏差）。
cr-gun-turret-damage-modifier=作用于所装弹药的原生炮塔伤害系数。默认 1。保留弹药和炮塔伤害研究加成。伤害取决于弹药，因此此项使用系数。
cr-gun-turret-ammo-consumption-modifier=原生弹药消耗系数。默认 1，消耗一发子弹而非一整个弹匣。0 可免消耗射击，但仍须装有弹药。小数由引擎处理。
cr-gun-turret-rotation-speed=绝对转向速度。默认 0.015。0 禁止转向，1 为每 tick 一整圈。修改后同时应用于两种原生转向变体。
cr-gun-turret-preparing-time=原生准备时长等于 1 / preparing_speed。默认 12.5 tick（速度 0.08），最小 1 tick，同时修改两种速度变体。实际状态切换发生在整数 tick。
cr-gun-turret-folding-time=原生收起时长等于 1 / folding_speed。默认 12.5 tick（速度 0.08），最小 1 tick，同时修改两种速度变体。
cr-gun-turret-inventory-size=弹药库存槽数，非子弹数量或弹匣容量。默认 1。容量还取决于弹药堆叠数。减少槽数可能丢失已存弹药，请先备份存档。
cr-gun-turret-automated-ammo-count=机械臂尝试补充的原生弹药物品数。默认 10 个弹匣。受库存容量限制，不改变弹匣容量或物品堆叠数。
cr-gun-turret-prepare-with-no-ammo=未装弹药时允许进入原生准备状态。默认开启。
cr-gun-turret-shoot-in-prepare-state=准备状态中允许原生射击。默认关闭。
cr-gun-turret-start-attacking-only-when-can-shoot=进入开始攻击状态前检查弹药。默认关闭。不会免除开火所需的弹药。
cr-gun-turret-leave-attacking-if-shoot-fails=例如弹药耗尽导致射击失败时的原生状态处理。默认开启。
cr-gun-turret-can-retarget-while-starting-attack=开始攻击期间允许原生重选目标。默认关闭。效果取决于原生状态切换，不添加额外动画。
cr-gun-turret-allow-turning-when-starting-attack=开始攻击期间允许原生转向。默认关闭。
cr-gun-turret-range-mode=原生射程距离计算方式。默认为中心到中心。其他方式会考虑炮塔和/或目标的包围盒。
cr-gun-turret-health-penalty=对目标生命比例的索敌评分惩罚。较高值偏好受伤目标，负值偏好更健康的目标。默认 10。
cr-gun-turret-rotate-penalty=较高值降低需要更多转向的目标优先级。默认 0。
cr-gun-turret-fire-penalty=正值偏好未附着可蔓延火焰效果的目标。默认 0。
cr-gun-turret-threatening-asteroid-penalty=正值降低有威胁星岩的优先级，负值提升其优先级。默认 -20。有星岩目标时生效。
cr-gun-turret-call-for-help-radius=原生呼叫支援半径。默认 40。不会扩展其他炮塔的射程。
cr-gun-turret-max-health=品质加成前的基础最大生命值。默认 400。加载存档时已有实体的当前生命值由引擎处理，此项不会主动治疗。
cr-gun-turret-healing-per-second=每秒恢复的绝对生命值，除以 60 后写入每 tick 恢复量。默认 0。负值造成被动掉血。较慢的恢复由引擎每秒应用一次。
cr-gun-turret-repair-speed-modifier=维修工具作用于此炮塔时的原生速度系数。默认 1。
cr-gun-turret-is-military-target=将炮塔作为敌方高优先级军事目标。默认开启。
cr-gun-turret-alert-when-attacking=原生攻击警报。默认开启。
cr-gun-turret-alert-when-damaged=原生受损警报。默认开启。
cr-gun-turret-create-ghost-on-death=摧毁后按阵营的正常规则生成原生幽灵。默认开启。
cr-gun-turret-circuit-wire-max-distance=此炮塔的最大信号线连接距离。默认 9。连接还受另一端的连接距离限制。
cr-gun-turret-mining-time=角色和工具加成前的基础采掘时间。默认 0.5 秒。
cr-gun-turret-heating-energy=负值保留官方数据：基础游戏为 0 kW，太空时代为 50 kW。0 禁止冻结，正值设置供热需求。这不是开火用电。默认 -1。
cr-gun-turret-resistance-physical-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-physical-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-impact-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-impact-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-poison-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-poison-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-explosion-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-explosion-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-fire-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-fire-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-laser-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-laser-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-acid-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-acid-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。
cr-gun-turret-resistance-electric-decrease=使用原生抗性公式的固定伤害减免。默认 0。仅影响此类型的入站伤害。
cr-gun-turret-resistance-electric-percent=原生百分比伤害抗性，范围 0 到 100。默认 0。100 使炮塔免疫此类型伤害。

